# Local environment: Kafka (1 broker, KRaft mode, no Zookeeper) + MySQL
#
#   docker compose up -d        # starts everything and creates the topic
#   docker compose down         # stops the containers (Kafka and MySQL data are kept in volumes)
#   docker compose down -v      # stops and DELETES the volumes (to repeat the demo from scratch)

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: happiness-kafka
    ports:
      - "9092:9092"            # port for the producer/consumer running on your machine
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT (19092) = internal Docker network | EXTERNAL (9092) = your machine
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single broker => everything with replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Where Kafka writes its data (events, topics and consumer group offsets)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data      # keeps the events when the container is removed
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the workshop topic: happiness-events, 3 partitions, replication 1
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: happiness-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic happiness-events
        --partitions 3 --replication-factor 1
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: happiness-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: uwu2B
      MYSQL_DATABASE: happiness
      MYSQL_USER: happiness            # user used by the consumer (read/write)
      MYSQL_PASSWORD: happiness
    volumes:
      - mysqldata:/var/lib/mysql
      # These files run only the first time the database is created (empty volume).
      # The consumer also creates the tables if they are missing.
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./sql/create_bi_user.sql:/docker-entrypoint-initdb.d/02_create_bi_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  kafkadata:
  mysqldata:
